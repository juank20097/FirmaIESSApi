#
#  Nombrado segun PAS-EST-059: servicios svc-, contenedores ctn-,
#  redes net-, volumenes vol-, labels iess.* obligatorios.
#
#  Servicios incluidos:
#    - PostgreSQL  -> motor relacional principal (desarrollo local)
#    - MongoDB     -> auditoria
#    - Vault       -> gestion de secretos
#    - vault-init  -> carga automatica de secretos (vault-init.sh)
#    - MinIO       -> almacenamiento de objetos (PDF)
#
#  Uso:
#    Levantar todo:      docker-compose -f docker-compose-herramientas.yml up -d
#    Detener todo:       docker-compose -f docker-compose-herramientas.yml down
#    Ver logs:           docker-compose -f docker-compose-herramientas.yml logs -f
#    Recargar secretos:  docker-compose -f docker-compose-herramientas.yml up svc-vault-init
# ============================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────────
