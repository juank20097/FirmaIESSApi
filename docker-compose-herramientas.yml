#    healthcheck:
#      test: ["CMD-SHELL", "pg_isready -U postgres -d transversal_firmaec_db"]
#      interval: 10s
#      timeout: 5s
#      retries: 5

  # ── MongoDB ──────────────────────────────────────────────────
  svc-mongo-auditoria:
    image: mongo:7-jammy
    container_name: ctn-mongo-auditoria
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo_user
      MONGO_INITDB_ROOT_PASSWORD: mongo_password
      MONGO_INITDB_DATABASE: auditoria_iess_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    command: mongod --quiet --logpath /dev/null
    networks:
      - net-iess
    labels:
      iess.type: plataforma
      iess.project: transversal-firmaec-api
      iess.business: DNTI
      iess.domain: transversal
      iess.version: "7"
      iess.environment: dev
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── HashiCorp Vault ──────────────────────────────────────────
  svc-vault:
    image: hashicorp/vault:1.15
    container_name: ctn-vault
    restart: unless-stopped
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root-token
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    command: server -dev
    networks:
      - net-iess
    labels:
      iess.type: plataforma
      iess.project: transversal-firmaec-api
      iess.business: DNTI
      iess.domain: transversal
      iess.version: "1.15"
      iess.environment: dev
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vault Init ───────────────────────────────────────────────
  # Ejecuta vault-init.sh al levantar el ecosistema.
  # Para modificar secretos editar vault-init.sh y reejecutar:
  #   docker-compose -f docker-compose-herramientas.yml up svc-vault-init
  svc-vault-init:
    image: hashicorp/vault:1.15
    container_name: ctn-vault-init
    restart: "no"
    environment:
      VAULT_ADDR: "http://svc-vault:8200"
      VAULT_TOKEN: "root-token"
      IP_SERVER: ${IP_SERVER:-}
      VAULT_INIT_ENABLED: ${VAULT_INIT_ENABLED:-true}
    depends_on:
      svc-vault:
        condition: service_healthy
    networks:
      - net-iess
    volumes:
      - ./vault-init.sh:/vault-init.sh
    entrypoint: ["sh", "/vault-init.sh"]

  # ── MinIO ────────────────────────────────────────────────────
  svc-minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    container_name: ctn-minio-transversal-firmaec-api
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - net-iess
    labels:
      iess.type: plataforma
      iess.project: transversal-firmaec-api
      iess.business: DNTI
      iess.domain: transversal
      iess.version: "2024-11-07"
      iess.environment: dev
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

# ── Red compartida ───────────────────────────────────────────
networks:
  net-iess:
    external: true
    name: net-iess-transversal-firmaec-api-utils
    driver: bridge

# ── Volumenes persistentes ───────────────────────────────────
volumes:
#  postgres_data:
#    name: vol-postgres-transversal-firmaec-api
  mongo_data:
    name: vol-mongo-transversal-firmaec-api
  minio_data:
    name: vol-minio-transversal-firmaec-api
