#  Nombrado segun PAS-EST-059: servicios svc-, contenedores ctn-,
#  redes net-, labels iess.* obligatorios.
#
#  PREREQUISITO: El ecosistema de utilitarios debe estar
#  corriendo antes de levantar este archivo:
#    docker-compose -f docker-compose-utilitarios.yml up -d
#
#  Uso:
#    Construir y levantar: docker-compose up -d --build
#    Solo levantar:        docker-compose up -d
#    Ver logs:             docker-compose logs -f
#    Detener:              docker-compose down
#    Reconstruir imagen:   docker-compose build --no-cache
# ============================================================

services:

  firmaiess-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: firmaiess-api:2.0.0
    container_name: firmaiess-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8091:8090"
    volumes:
      - app_uploads:/app/uploads
    networks:
      - net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8090/api/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# ── Red compartida del stack HomeServer ──────────────────────
networks:
  net:
    external: true

# ── Volumenes persistentes ───────────────────────────────────
volumes:
  app_uploads:
    name: vol-firmaiess-api-uploads
